<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=block" rel="stylesheet">
<style>
body{margin:0;background:#FBF7EE;font-family:Fraunces,serif;color:#241E18}
h1{font-size:34px;line-height:1.12;text-align:center;margin:24px 16px 0;font-weight:600;text-wrap:balance}
em.hl{font-style:normal;padding:.05em .35em;margin:0 -.2em;box-decoration-break:clone;-webkit-box-decoration-break:clone;background-repeat:no-repeat;background-size:100% 92%;background-position:center}
.A em.hl{background-image:url("b4-marker-A.svg")}
.B em.hl{background-image:url("b4-marker-B.svg");color:#8A3A24}
.row{display:grid;grid-template-columns:390px 390px;gap:20px;width:800px}
.cell{width:390px;padding-bottom:30px;background:#FBF7EE;border:1px solid #D9CFBD}
small{display:block;font:600 11px ui-sans-serif;color:#7a6f60;padding:8px 12px}
/* animated draw-in preview, one easing token */
@keyframes draw{from{background-size:0 92%}to{background-size:100% 92%}}
</style>
<div class="row"><div class="cell A"><small>A, 390px, wraps to two lines</small><h1>Be in the conversation. <em class="hl">Trilsy writes the notes.</em></h1></div>
<div class="cell B"><small>B, 390px</small><h1>Be in the conversation. <em class="hl">Trilsy writes the notes.</em></h1></div></div>
