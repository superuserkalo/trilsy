63.4%20C575.2%2067.1%20541.8%2061.2%20521.9%2060.8%20C501.9%2060.5%20485.3%2061.0%20466.7%2061.1%20C448.1%2061.2%20428.9%2061.4%20410.2%2061.3%20C391.4%2061.3%20372.8%2061.2%20354.4%2061.0%20C336.0%2060.9%20318.6%2061.3%20299.6%2060.6%20C280.6%2059.9%20258.9%2057.1%20240.2%2057.0%20C221.4%2056.8%20205.7%2058.9%20187.0%2059.9%20C168.2%2060.9%20146.6%2062.8%20127.6%2063.1%20C108.5%2063.4%2092.4%2062.4%2072.7%2061.6%20C53.0%2060.8%2020.4%2062.8%209.5%2058.5%20C-1.4%2054.2%206.8%2042.1%207.2%2035.6%20C7.6%2029.0%201.0%2022.3%2011.6%2019.2%20Z%22%20fill%3D%22%23E6AB4F%22%20fill-opacity%3D%22.55%22%2F%3E%3C%2Fsvg%3E") no-repeat center/0 92%;animation:draw 600ms var(--ease-trilsy) 300ms forwards}

</style></head><body><div class="wrap" id="wrap">
<div class="card"><button class="replay" onclick="replay()">Replay both</button><div class="lab">1. Fixed SVG, CSS background<b>no script</b></div><h1 class="fx" id="h1a">Be in the conversation. <em>Trilsy writes the notes.</em></h1></div>
<div class="card" id="cardb" style="position:relative"><div class="lab">2. Rough.js drawn directly (v4.6.1)<b>library, loaded from a CDN</b></div><h1 class="rn" id="h1b" style="position:relative;z-index:1">Be in the conversation. <em id="rn">Trilsy writes the notes.</em></h1></div>
<pre id="res" style="display:none"></pre>
</div>
<script src="https://unpkg.com/roughjs@4.6.1/bundled/rough.js"></script>
<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const q=new URLSearchParams(location.search);
const t0=performance.now();let cls=0;
try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch(e){}
const card=document.getElementById('cardb'),em=document.getElementById('rn'),h=document.getElementById('h1b');
const NS='http://www.w3.org/2000/svg';
let svg;
function draw(animate){
  if(svg)svg.remove();
  svg=document.createElementNS(NS,'svg');svg.setAttribute('class','rj');
  const cb=card.getBoundingClientRect();
  svg.setAttribute('width',cb.width);svg.setAttribute('height',cb.height);
  svg.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible';
  const rc=rough.svg(svg);
  [...em.getClientRects()].forEach((r,i)=>{
    const x=r.left-cb.left, y=r.top-cb.top, w=r.width, hh=r.height;
    const seed=11+i*7;
    const g=document.createElementNS(NS,'g');g.setAttribute('class','pass');
    // several overlapping marker passes: moderate-width strokes with their own tilt and bowing, round caps, uneven overshoot
    const passes=[
      {y0:.34,y1:.30,sw:.46,x0:-10,x1:12,op:.80,sd:0},
      {y0:.55,y1:.60,sw:.42,x0:-4,x1:6,op:.75,sd:5},
      {y0:.74,y1:.70,sw:.30,x0:-14,x1:-2,op:.62,sd:9},
      {y0:.46,y1:.50,sw:.34,x0:8,x1:16,op:.55,sd:13}];
    passes.forEach(P=>{
      const ln=rc.line(x+P.x0-4,y+hh*P.y0,x+w+P.x1+4,y+hh*P.y1,{seed:seed+P.sd,roughness:1.3,bowing:1.8,strokeWidth:hh*P.sw,stroke:'#E6AB4F',disableMultiStroke:true});
      ln.setAttribute('opacity',P.op);g.appendChild(ln);
    });
    svg.appendChild(g);
  });
  svg.querySelectorAll('path').forEach(p=>{p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round')});
  card.appendChild(svg);
  if(animate&&!reduce){svg.style.clipPath='inset(0 100% 0 0)';svg.style.transition='clip-path 600ms cubic-bezier(0.22,1,0.36,1)';requestAnimationFrame(()=>requestAnimationFrame(()=>{svg.style.clipPath='inset(0 0 0 0)'}))}
}
const rec={};rec.h1b_before=h.getBoundingClientRect().height;
let drawn=false;
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{setTimeout(()=>{rec.drawAt=Math.round(performance.now()-t0);draw(true);drawn=true},300)});
// redraw on resize with the same seeds, only when the wrap changes
let last=0;new ResizeObserver(()=>{if(!drawn)return;const n=em.getClientRects().length+':'+Math.round(card.getBoundingClientRect().width);if(n!==last){last=n;draw(false)}}).observe(card);
setTimeout(()=>{rec.h1b_after=h.getBoundingClientRect().height;rec.cls=+cls.toFixed(4);rec.lines=em.getClientRects().length;rec.w=innerWidth;rec.svgPaths=svg?svg.querySelectorAll('path').length:0;rec.svgBytes=svg?svg.outerHTML.length:0;
 if(!q.has('nr'))document.getElementById('wrap').style.maxWidth='420px';
 setTimeout(()=>{rec.linesAfterResize=em.getClientRects().length;rec.paths2=svg.querySelectorAll('path').length;rec.fixedLines=[...document.querySelector('.fx em').getClientRects()].length;const r=document.getElementById('res');r.textContent=JSON.stringify(rec);r.style.display=q.has('m')?'block':'none';r.id='res-done'},900)},2400);
function replay(){location.reload()}
</script></body></html>
