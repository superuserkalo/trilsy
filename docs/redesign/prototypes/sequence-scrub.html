<!doctype html>
<!--
  Study prototype for docs/redesign/behavior-aerivoice.md, pattern 1 (the pinned, scroll-scrubbed sequence).
  Our own code. The reference draws 100 rendered frames of a laptop; this draws 100 steps of a plain
  shape instead, because the point is the scroll mapping, not the artwork. Not site code.
  Open through a local server: python3 -m http.server -d docs/redesign/prototypes 4173
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype: scroll-scrubbed sequence</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.4 ui-sans-serif, system-ui; background: #0b0b0c; color: #f2f2f2; }
  .lead { height: 100svh; display: grid; place-items: center; color: #888; }
  .tail { height: 120svh; display: grid; place-items: center; color: #888; }
  .track { height: 410svh; position: relative; }
  .stage { position: sticky; top: 0; height: 100svh; overflow: hidden; contain: strict; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen { position: absolute; left: 50%; top: 42%; width: 1764px; height: 1153px; margin: -576px 0 0 -882px; border-radius: 28px; background: #050506; visibility: hidden; overflow: hidden; }
  .display { position: absolute; inset: 18px; border-radius: 12px; background: linear-gradient(140deg, #1b2a6b, #3a52d0 55%, #0e1640); display: grid; place-items: start center; padding-top: 40px; font-size: 44px; }
  .captions { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: linear-gradient(#0000, #000 60%); pointer-events: none; }
  .captions p { position: absolute; left: 24px; right: 24px; top: 55%; text-align: center; font-size: clamp(22px, 2.7vw, 42px); font-weight: 500; opacity: 0; transform: translateY(10px); transition: opacity .18s ease-in, transform .18s ease-in; }
  .captions p.on { opacity: 1; transform: none; transition: opacity .36s ease-out .16s, transform .36s ease-out .16s; }
  .cue { position: absolute; left: 50%; bottom: 20px; opacity: 0; transition: opacity .3s ease-out; }
  .cue.on { opacity: 1; }
  @media (max-width: 600px) { .track { height: 353svh; } }
  @media (prefers-reduced-motion: reduce) { .track { height: auto; } .stage { position: relative; } }
</style>
</head>
<body>
<section class="lead">Scroll</section>
<div class="track" data-p="track">
  <div class="stage" data-p="stage">
    <canvas data-p="canvas"></canvas>
    <div class="screen" data-p="screen"><div class="display" data-p="display"><span data-p="demo"></span></div></div>
    <div class="captions" data-p="captions"><p>Step one.</p><p>Step two.</p><p>Step three.</p><p>Step four.</p></div>
    <span class="cue" data-p="cue">&#8964;</span>
  </div>
</div>
<section class="tail">End</section>

<script>
// Thresholds on the 0..1 progress of the track, as read from the reference (see the spec).
const T = { lidOpen: 0.21, zoomStart: 0.154, screenOn: 0.28, zoomed: 0.42, demoEnd: 0.7, zoomedOut: 0.78, screenOff: 0.815 };
const PREROLL = 0.55;      // progress starts while the stage is still 55% of a viewport below the top
const TAU = 0.14;          // seconds; displayed progress eases toward scroll with this time constant
const FRAMES = 100;
const $ = s => document.querySelector(`[data-p="${s}"]`);
const track = $('track'), stage = $('stage'), canvas = $('canvas'), screen = $('screen'), cue = $('cue'), demo = $('demo');
const caps = [...$('captions').children], display = $('display');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp01 = v => Math.min(1, Math.max(0, v)), step = v => v * v * (3 - 2 * v), seg = (p, a, b) => clamp01((p - a) / (b - a));
const ctx = canvas.getContext('2d');

function state(p) {
  return {
    lid: seg(p, 0, T.lidOpen) - seg(p, T.screenOff, 1),
    glass: step(seg(p, T.lidOpen - 0.015, T.lidOpen)) - step(seg(p, T.screenOff, T.screenOff + 0.015)),
    screen: step(seg(p, T.lidOpen, T.screenOn)) - step(seg(p, T.zoomedOut, T.screenOff)),
    zoom: step(seg(p, T.zoomStart, T.zoomed)) - step(seg(p, T.demoEnd, T.zoomedOut)),
    demo: p >= T.zoomed && p < T.demoEnd, closing: p >= T.demoEnd,
  };
}
function progress() {
  const r = track.getBoundingClientRect(), pre = innerHeight * PREROLL, span = r.height - innerHeight + pre;
  return span > 0 ? clamp01((pre - r.top) / span) : 1;
}
function draw(frame, zoom) {
  const w = canvas.width = stage.clientWidth * devicePixelRatio, h = canvas.height = stage.clientHeight * devicePixelRatio;
  const open = frame / (FRAMES - 1), cx = w / 2, baseY = h * (0.75 - 0.33 * open * (1 - zoom)), bw = w * 0.2 * (1 + 6 * zoom);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#2a2a2d'; ctx.beginPath(); ctx.moveTo(cx - bw, baseY); ctx.lineTo(cx + bw, baseY); ctx.lineTo(cx + bw * 1.08, baseY + bw * 0.12 * (0.2 + open)); ctx.lineTo(cx - bw * 1.08, baseY + bw * 0.12 * (0.2 + open)); ctx.fill();
  const lidH = bw * 1.25 * Math.sin(open * Math.PI / 2);   // the lid as a quad that stands up over 100 steps
  ctx.fillStyle = '#19191b'; ctx.fillRect(cx - bw, baseY - lidH - 4, bw * 2, lidH + 4);
}

// The demo inside the screen runs on the clock, not on scroll, while progress sits in the demo window.
const LOOP = [[1, 2600], [2, 1500], [3, 1900]];   // caption index, hold in ms
let demoT0 = 0, caption = 0;
function demoCaption(now) {
  let t = (now - demoT0) % LOOP.reduce((a, l) => a + l[1], 0);
  for (const [i, ms] of LOOP) { if (t < ms) return i; t -= ms; }
}
let shown = -1, last = 0, wasDemo = false;
function frame(now) {
  const target = reduced ? 1 : progress(), dt = Math.min((now - last) / 1000, 0.1); last = now;
  shown = shown < 0 ? target : shown + (target - shown) * (1 - Math.exp(-dt / TAU));
  if (Math.abs(target - shown) < 1e-4) shown = target;
  const s = state(shown), base = 0.249 * Math.min(innerWidth / 1440, innerHeight / 900), full = 2.5 * Math.min(innerWidth / 1440, innerHeight / 900);
  draw(Math.round(s.lid * (FRAMES - 1)), s.zoom);
  screen.style.transform = `scale(${base * Math.pow(full / base, s.zoom)})`;   // zoom interpolates scale geometrically
  screen.style.opacity = s.glass; screen.style.visibility = s.glass > 0 ? 'visible' : 'hidden';
  display.style.opacity = s.screen;
  if (s.demo && !wasDemo) demoT0 = now; wasDemo = s.demo;
  caption = s.demo ? demoCaption(now) : s.closing ? -1 : 0;
  caps.forEach((p, i) => p.classList.toggle('on', i === caption));
  demo.textContent = s.demo ? ['', 'listening…', 'cleaning up…', 'pasted'][caption] : '';
  cue.classList.toggle('on', s.demo);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
