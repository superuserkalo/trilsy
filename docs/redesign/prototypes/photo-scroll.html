<!doctype html>
<!--
  Study prototype for docs/redesign/behavior-wisprflow.md, pattern 1 (the photo scroll effect).
  Our own code and placeholder art. Not site code: the site version is built in Phase D with
  Tailwind, shadcn/ui and vgpu. The three "photographs" are generated boxes marked TODO: image.
  Open through a local server: python3 -m http.server -d docs/redesign/prototypes 4173
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype: photo card scroll</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.4 ui-sans-serif, system-ui; background: #f6f1e7; color: #1b1b1b; }
  .lead, .tail { height: 120vh; display: grid; place-items: center; color: #777; }
  #pin { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .band { position: absolute; inset: 0; background: #10323a; color: #f6f1e7; border-radius: 0 0 56px 56px; text-align: center; padding-top: 12vh; will-change: transform; }
  .band h2 { font: 400 44px/1.1 ui-serif, Georgia, serif; }
  .small { position: absolute; top: 39vh; height: 501px; left: 140px; border: 1px solid #ffffff33; border-radius: 16px; overflow: hidden; padding: 20px; font-size: 14px; color: #f6f1e7; white-space: nowrap; }
  .card { position: absolute; overflow: hidden; border-radius: 16px; will-change: transform, width, left; }
  .card .img, .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .img { background-size: cover; background-position: center; }
  .card .todo { position: absolute; left: 12px; bottom: 10px; font: 11px ui-monospace, monospace; color: #fff; opacity: .7; }
  .tabs, .copy { position: absolute; top: 50vh; opacity: 0; transition: opacity .45s ease; }
  .tabs { left: 8vw; list-style: none; padding: 0; transform: translateY(-50%); }
  .tabs li { padding: 4px 12px; border-left: 2px solid transparent; color: #999; transition: color .22s ease, border-color .22s ease; }
  .tabs li.on { color: #1b1b1b; border-color: #d2552f; }
  .copy { right: 8vw; width: 22vw; }
  .copy p { position: absolute; opacity: 0; transition: opacity .22s ease; }
  .copy p.on { opacity: 1; }
  .show { opacity: 1; }
  /* Narrow screens: no pin, the card sits in the flow and chapters play on a timer while in view. */
  @media (max-width: 991px) {
    #pin { height: auto !important; }
    .stage { position: relative; height: auto; overflow: visible; padding: 0 16px 48px; }
    .band { position: relative; inset: auto; margin: 0 -16px; padding: 64px 16px 180px; }
    .small { display: none; }
    .card { position: relative; left: auto !important; top: auto !important; width: 100% !important; height: 120vw !important; margin-top: -140px; transform: none !important; }
    .tabs { display: none; }
    .copy { position: relative; top: auto; right: auto; width: auto; opacity: 1; margin-top: 24px; min-height: 80px; }
  }
</style>
</head>
<body>
<section class="lead">Scroll</section>
<section id="pin" data-p="pin">
  <div class="stage" data-p="stage">
    <div class="band" data-p="band">
      <h2>Heading goes here</h2>
      <div class="small" data-p="small">Before</div>
    </div>
    <div class="card" data-p="card">
      <div class="img" data-p="img0"></div>
      <div class="img" data-p="img1" style="opacity:0"></div>
      <div class="img" data-p="img2" style="opacity:0"></div>
      <canvas data-p="melt" style="display:none"></canvas>
      <span class="todo">TODO: image</span>
    </div>
    <ol class="tabs" data-p="tabs"><li>Chapter one</li><li>Chapter two</li><li>Chapter three</li></ol>
    <div class="copy" data-p="copy"><p>Copy for chapter one.</p><p>Copy for chapter two.</p><p>Copy for chapter three.</p></div>
  </div>
</section>
<section class="tail">End</section>

<script>
// Phase lengths in viewport heights, as measured on the reference (see the spec).
const IN = 0.25, GROW = 0.8, HOLD = 0.25, SHRINK = 0.7, CHAPTERS = [1.0, 1.0, 1.2];
const MELT_MS = 700;      // time-based photo swap, started when the chapter changes
const DIP = 70;           // px the card sinks mid-travel
const CARD = { w: 400, h: 468, h0: 501, margin: 140, r0: 16, rFull: 40 };
const $ = s => document.querySelector(`[data-p="${s}"]`);
const pin = $('pin'), band = $('band'), small = $('small'), card = $('card'), tabs = $('tabs'), copy = $('copy'), melt = $('melt');
const imgs = [$('img0'), $('img1'), $('img2')];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const desktop = matchMedia('(min-width: 992px)');
const smooth = t => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
const clamp01 = t => Math.min(1, Math.max(0, t));

// Placeholder "photographs": a subject blob over horizontal motion streaks, dusk palette, grain.
function placeholder(a, b, c) {
  const cv = document.createElement('canvas'); cv.width = 900; cv.height = 600; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 900, 600); g.addColorStop(0, a); g.addColorStop(1, b); x.fillStyle = g; x.fillRect(0, 0, 900, 600);
  for (let i = 0; i < 60; i++) { x.fillStyle = i % 3 ? c + '22' : '#ffffff14'; x.fillRect(Math.random() * 900 - 200, Math.random() * 600, 300 + Math.random() * 500, 2 + Math.random() * 14); }
  x.filter = 'blur(18px)'; x.fillStyle = '#1a1410cc'; x.beginPath(); x.ellipse(450, 380, 110, 190, 0, 0, 7); x.fill(); x.filter = 'none';
  const d = x.getImageData(0, 0, 900, 600); for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - 0.5) * 34; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; } x.putImageData(d, 0, 0);
  return cv;
}
const art = [placeholder('#7fa6b8', '#c9a26a', '#e9d9b0'), placeholder('#0f2c3a', '#21505c', '#f0a24a'), placeholder('#3a1d12', '#b5642a', '#ffd08a')];
art.forEach((cv, i) => { imgs[i].style.backgroundImage = `url(${cv.toDataURL('image/jpeg', 0.8)})`; });

// Melt: both photos are pushed sideways by a soft noise field while they cross-fade.
const gl = reduced ? null : melt.getContext('webgl', { premultipliedAlpha: false });
let drawMelt = null;
if (gl) {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;v.y=1.-v.y;gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision mediump float;varying vec2 v;uniform sampler2D A,B;uniform float t;
    float h(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*45758.5);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    void main(){float c=0.,w=.5;vec2 p=v*3.;for(int i=0;i<4;i++){c+=w*n(p);p*=2.;w*=.5;}
      float push=c*.35;
      vec4 from=texture2D(A,clamp(v+vec2(push*t,0.),0.,1.));
      vec4 to=texture2D(B,clamp(v-vec2(push*(1.-t),0.),0.,1.));
      gl_FragColor=mix(from,to,t);}`));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.bindAttribLocation(prog, 0, 'a'); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = art.map(cv => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; });
  gl.uniform1i(gl.getUniformLocation(prog, 'A'), 0); gl.uniform1i(gl.getUniformLocation(prog, 'B'), 1);
  const ut = gl.getUniformLocation(prog, 't');
  drawMelt = (a, b, t) => { melt.width = 900; melt.height = 600; gl.viewport(0, 0, 900, 600); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[a]); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex[b]); gl.uniform1f(ut, t); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
}

let shown = 0, meltRaf = 0;
function setChapter(i) {
  [...tabs.children].forEach((li, k) => li.classList.toggle('on', k === i));
  [...copy.children].forEach((p, k) => p.classList.toggle('on', k === i));
  if (i === shown) return;
  const from = shown; shown = i; cancelAnimationFrame(meltRaf);
  const done = () => { imgs.forEach((im, k) => (im.style.opacity = k === i ? 1 : 0)); melt.style.display = 'none'; };
  if (!drawMelt) return done();
  imgs.forEach(im => (im.style.opacity = 0)); melt.style.display = 'block';
  const t0 = performance.now();
  (function tick(now) { const u = clamp01((now - t0) / MELT_MS); const e = u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); drawMelt(from, i, e); u < 1 ? (meltRaf = requestAnimationFrame(tick)) : done(); })(t0);
}

// Scroll choreography (desktop). Card and band geometry are a pure function of the scroll offset.
let geo, target = 0, filled = false, fill = 0, fillFrom = 0, fillT0 = -1e9;
const ends = t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.05 ? 0.15 * (t / 0.05) : t > 0.95 ? 1 - 0.15 * ((1 - t) / 0.05) : 0.15 + ((t - 0.05) / 0.9) * 0.7);
function measure() {
  const vh = innerHeight, vw = innerWidth;
  const top0 = 0.39 * vh, top2 = top0 + 17, centre = vh / 2 - CARD.h / 2;
  const rise = top2 - centre;                       // last stretch of the travel, where the card rises with the page
  const travel = 1.48 * vh;                         // reference: the scroll the stage needs to arrive centred
  const a = IN * vh, b = a + GROW * vh, c = b + HOLD * vh, d = c + SHRINK * vh, e = d + travel;
  const stops = [e]; CHAPTERS.forEach(v => stops.push(stops[stops.length - 1] + v * vh));
  geo = { vh, vw, top0, top2, rise, travel, a, b, c, d, e, stops, total: stops[stops.length - 1], w1: vw - 2 * CARD.margin };
  pin.style.height = desktop.matches ? geo.total + vh + 'px' : '';
}
function paint(s) {
  const g = geo, gt = clamp01((s - g.a) / (g.b - g.a)), shrink = smooth((s - g.c) / (g.d - g.c));
  // Grow: the side panel starts at 28% of the stage and closes with scroll. Its ends move fast, it
  // collapses quicker once under 20%, and at 80% of the phase a 340ms timed fill closes what is left.
  if (!filled && gt >= 0.8) { filled = true; fillFrom = fill; fillT0 = performance.now(); }
  else if (filled && gt < 0.68) { filled = false; fillFrom = fill; fillT0 = performance.now(); }
  fill = reduced ? +filled : fillFrom + ((filled ? 1 : 0) - fillFrom) * smooth((performance.now() - fillT0) / 340);
  let side = g.w1 * 0.28 * (1 - ends(gt)); const frac = side / g.w1;
  if (frac < 0.2) side *= smooth(frac / 0.2);
  side *= 1 - fill; const grow = 1 - side / (g.w1 * 0.28);
  const S = Math.min(g.travel, Math.max(0, s - g.d)), ride = S / g.travel;
  const w = g.w1 - side + (CARD.w - g.w1) * shrink;
  const left = CARD.margin + side + ((g.vw - CARD.w) / 2 - CARD.margin) * shrink;
  const top = g.top0 + 17 * shrink - Math.max(0, S - (g.travel - g.rise)) + DIP * Math.sin(Math.PI * ride);
  card.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${CARD.h0 + (CARD.h - CARD.h0) * shrink}px;border-radius:${CARD.r0 + (CARD.rFull - CARD.r0) * grow * (1 - shrink)}px`;
  band.style.transform = `translateY(${-S}px)`;
  small.style.width = side + 'px'; small.style.visibility = side < 24 ? 'hidden' : 'visible';
  const arrived = s >= g.e - 1; tabs.classList.toggle('show', arrived); copy.classList.toggle('show', arrived);
  let ch = 0; while (ch < CHAPTERS.length - 1 && s >= g.stops[ch + 1]) ch++;
  setChapter(arrived ? ch : 0);
}
function frame() {
  if (desktop.matches) {
    target = Math.min(geo.total, Math.max(0, scrollY - pin.offsetTop));
    paint(target);   // geometry follows scroll directly; only the photo swap and the fill run on the clock
  }
  requestAnimationFrame(frame);
}
measure(); addEventListener('resize', measure); requestAnimationFrame(frame);

// Chapter snap: 100ms after scrolling stops inside the chapter zone, glide (300ms) to the middle of the
// chapter in the direction of travel, or to the end of the pin. One gesture moves one chapter.
let lastSnap = null, idle = 0, gliding = false;
function snapPoints() { const p = []; for (let i = 0; i < CHAPTERS.length; i++) p.push((geo.stops[i] + geo.stops[i + 1]) / 2); p.push(geo.total); return p; }
function snap() {
  if (!desktop.matches || reduced || gliding) return;
  const s = scrollY - pin.offsetTop;
  if (s < geo.e - 1 || s > geo.total + 1) { lastSnap = null; return; }
  const pts = snapPoints();
  if (lastSnap == null) lastSnap = pts.reduce((a, b) => (Math.abs(b - s) < Math.abs(a - s) ? b : a));
  let to = lastSnap;
  const eps = 0.004 * geo.total;
  if (s > lastSnap + eps) to = pts.find(p => p > lastSnap + 1) ?? lastSnap;
  else if (s < lastSnap - eps) to = [...pts].reverse().find(p => p < lastSnap - 1) ?? lastSnap;
  lastSnap = to;
  const from = scrollY, dest = pin.offsetTop + to, t0 = performance.now(); gliding = true;
  (function glide(now) { const u = clamp01((now - t0) / 300), e = u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); scrollTo(0, from + (dest - from) * e); u < 1 ? requestAnimationFrame(glide) : setTimeout(() => (gliding = false), 60); })(t0);
}
addEventListener('scroll', () => { clearTimeout(idle); idle = setTimeout(snap, 100); }, { passive: true });

// Narrow screens: chapters advance on a timer while the card is in view.
let timer = 0;
new IntersectionObserver(([en]) => {
  clearInterval(timer); if (desktop.matches || !en.isIntersecting) return;
  timer = setInterval(() => setChapter((shown + 1) % CHAPTERS.length), 4500);
}, { rootMargin: '0px 0px -15% 0px' }).observe(card);
</script>
</body>
</html>
