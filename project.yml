name: Trilsy
options:
  bundleIdPrefix: com.superuserkalo
  deploymentTarget:
    macOS: '15.0'
packages:
  Argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 2.31.3
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ARCHS: arm64
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Trilsy:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: Argmax
        product: WhisperKit
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Trilsy
        NSMicrophoneUsageDescription: Trilsy records your microphone to create transcripts and notes on this Mac.
        NSAudioCaptureUsageDescription: Trilsy captures application audio to create transcripts and notes on this Mac.
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: '15.0'
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Config/Trilsy.entitlements
      properties:
        com.apple.security.device.audio-input: true
  TrilsyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Trilsy
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Trilsy:
    build:
      targets:
        Trilsy: all
    test:
      targets: [TrilsyTests]
